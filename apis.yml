description: >-
  Shortcut (formerly Clubhouse, renamed 2021) is a fast, lightweight project-management
  platform where software teams and their AI agents plan, build, and ship together —
  issue tracking, sprints, docs, and roadmaps in one tool. Founded in 2014 in New York
  City by Kurt Schrader and Andrew Childs and backed by Battery Ventures and Greylock,
  it is used by more than 10,000 companies. Shortcut exposes a full REST API v3
  (api.app.shortcut.com) covering Stories, Epics, Iterations, Objectives, Docs,
  Workflows, and more, secured by a Shortcut-Token API key or OAuth 2.0, plus outgoing
  webhooks and an official hosted MCP server for agent coordination (Korey AI).
